name: Rainbow81 constructed-spectrum negative control

on:
  push:
    branches:
      - audit/rainbow81-mixture-2026-10-14
    paths:
      - experiments/rainbow81-mixture-2026-10-14.py
      - .github/workflows/rainbow81-mixture-audit.yml
  pull_request:
    paths:
      - experiments/rainbow81-mixture-2026-10-14.py

jobs:
  synthetic-mixture:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test constructed spectral mixtures
        run: python experiments/rainbow81-mixture-2026-10-14.py > audit-output.json
      - name: Report result
        run: cat audit-output.json
      - uses: actions/upload-artifact@v4
        with:
          name: rainbow81-mixture-python-${{ matrix.python-version }}
          path: audit-output.json
